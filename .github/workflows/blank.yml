name: TCL Remote Custom - Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature-spanish-high-contrast]
permissions:
  contents: write

# Evita compilar varias veces la misma rama; conserva solo la última versión.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          validate-wrappers: false

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TCL-Remote-Custom-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar APK para descarga directa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2026.11.10-4
          name: MANDO TCL - 10 noviembre 2026 (actualización)
          body: APK compilado automáticamente. Incluye acciones de fábrica iniciales, detección de Prime Video y menús compactos adaptados a la pantalla.
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
