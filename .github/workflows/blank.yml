name: MANDO TCL - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature-spanish-high-contrast
      - audit-fixes

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          validate-wrappers: false

      - name: Preparar firma permanente
        id: signing
        env:
          ANDROID_SIGNING_BUNDLE_BASE64: ${{ secrets.ANDROID_SIGNING_BUNDLE_BASE64 }}
        run: |
          if [ -n "$ANDROID_SIGNING_BUNDLE_BASE64" ]; then
            echo "$ANDROID_SIGNING_BUNDLE_BASE64" | base64 --decode > /tmp/mandotcl-signing.zip
            unzip -o /tmp/mandotcl-signing.zip -d .
            test -s keybindertv.keystore
            test -s key.properties
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ejecutar pruebas unitarias
        run: gradle --no-daemon testDebugUnitTest

      - name: Compilar APK firmado
        if: steps.signing.outputs.enabled == 'true'
        run: |
          gradle --no-daemon assembleRelease -PAPP_VERSION_CODE=${{ github.run_number }} -PAPP_VERSION_NAME=2026.11.10.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk mando-tcl.apk

      - name: Compilar APK de prueba
        if: steps.signing.outputs.enabled != 'true'
        run: gradle --no-daemon assembleDebug -PAPP_VERSION_CODE=${{ github.run_number }} -PAPP_VERSION_NAME=2026.11.10.${{ github.run_number }}

      - name: Guardar APK firmado
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mando-tcl-release
          path: mando-tcl.apk
          if-no-files-found: error
          retention-days: 7

      - name: Guardar APK de prueba
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mando-tcl-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar APK firmado
        uses: actions/download-artifact@v4
        with:
          name: mando-tcl-release
          path: .

      - name: Publicar actualización oficial
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2026.11.10-${{ github.run_number }}
          name: MANDO TCL - actualización ${{ github.run_number }}
          body: Nueva versión firmada de MANDO TCL. Conserva las asignaciones y permite actualizar desde la propia aplicación.
          files: mando-tcl.apk
          fail_on_unmatched_files: true
